<div class="frame-parent16">
      @for (item of menuItems; track item.sequence) {
            <div class="menuOption" [ngClass]="item.selected ? 'selected' : ''" (click)="itemClicked(item)">
                  <img class="outline-settings-fine-tunin" alt="" [src]="item.icon">          
                  <div class="revenue">{{item.displayText}}</div>
            </div>
          }
</div>
